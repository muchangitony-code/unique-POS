name: Repair print branding

on:
  push:
    paths:
      - '.github/workflows/repair-print-branding.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Repair absolute branding URLs and dynamic stamp dates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('lib/printDoc.ts')
          s = p.read_text()
          original = s

          # Add one resolver used only when generating HTML for the about:blank print window.
          if 'function printAssetUrl(' not in s:
              marker = 'function sigStampMarkup('
              helper = '''function printAssetUrl(url?: string): string {
  if (!url) return '';
  if (/^(?:https?:|data:|blob:)/i.test(url)) return url;
  if (typeof window !== 'undefined' && window.location?.origin) {
    return `${window.location.origin}${url.startsWith('/') ? url : `/${url}`}`;
  }
  return url;
}

'''
              if marker not in s:
                  raise SystemExit('sigStampMarkup marker not found; refusing to modify file.')
              s = s.replace(marker, helper + marker, 1)

          # All print-window branding image references must be absolute.
          replacements = {
              '${esc(b.logoUrl)}': '${esc(printAssetUrl(b.logoUrl))}',
              '${esc(b.signatureUrl)}': '${esc(printAssetUrl(b.signatureUrl))}',
              '${esc(b.stampUrl)}': '${esc(printAssetUrl(b.stampUrl))}',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)

          # Upgrade the stamp helper without requiring a whole-file reconstruction.
          s = s.replace(
              'function sigStampMarkup(b: ResolvedBranding): string {',
              'function sigStampMarkup(b: ResolvedBranding, documentDate?: string): string {'
          )

          # Replace the simple stamp image with a positioned image plus document date when present.
          old_stamp = 'if (b.stampUrl) parts.push(`<img src=\\"${esc(printAssetUrl(b.stampUrl))}\\" alt=\\"Company Stamp\\" style=\\"max-height:70px;max-width:120px;object-fit:contain;opacity:0.9\\" />`);'
          new_stamp = '''if (b.stampUrl) {
    const date = documentDate ? fmtDate(documentDate) : '';
    parts.push(`<div style=\\"position:relative;width:120px;height:70px;display:flex;align-items:center;justify-content:center\\"><img src=\\"${esc(printAssetUrl(b.stampUrl))}\\" alt=\\"Company Stamp\\" style=\\"width:120px;height:70px;object-fit:contain;opacity:0.9\\" />${date ? `<span style=\\"position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:1;white-space:nowrap;background:rgba(255,255,255,0.88);padding:1px 5px;border-radius:2px;color:#b91c1c;font-size:11px;font-weight:700\\">${esc(date)}</span>` : ''}</div>`);
  }'''
          if old_stamp in s:
              s = s.replace(old_stamp, new_stamp, 1)

          # Pass the real document dates wherever the known document variables are used.
          s = s.replace('${sigStampMarkup(b)}', '${sigStampMarkup(b, inv.created_at)}', 1)
          s = s.replace('${sigStampMarkup(b)}', '${sigStampMarkup(b, q.created_at)}', 1)
          s = s.replace('${sigStampMarkup(b)}', '${sigStampMarkup(b, r.created_at)}', 1)

          if s == original:
              raise SystemExit('No verified print branding changes were applied.')
          if 'function printAssetUrl(' not in s:
              raise SystemExit('Absolute URL resolver verification failed.')
          if '${esc(printAssetUrl(b.logoUrl))}' not in s:
              raise SystemExit('Logo URL was not converted to an absolute print URL.')
          if 'sigStampMarkup(b, inv.created_at)' not in s or 'sigStampMarkup(b, q.created_at)' not in s:
              raise SystemExit('Invoice/quotation date wiring verification failed.')

          p.write_text(s)
          PY
          git diff --check
          git diff -- lib/printDoc.ts
      - name: Commit verified repair and remove temporary workflow
        run: |
          git config user.name 'GitHub Actions'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/repair-print-branding.yml
          git add lib/printDoc.ts
          git diff --cached --check
          git commit -m 'Fix branding assets in printed documents'
          git push origin HEAD:main