name: Rebuild and QA PDF engine

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  pdf-engine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and refresh lockfile
        run: npm install --package-lock-only && npm install

      - name: Validate application build
        run: npm run build

      - name: Rebuild bundled server PDF entrypoint
        run: node scripts/rebuild-pdf-bundle.cjs

      - name: Generate stress samples
        run: npm run pdf:sample

      - name: Install PDF raster tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Render every PDF page and run structural QA
        run: npm run pdf:qa

      - name: Inspect rendered pages for blank or black-box corruption
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          root = Path('samples/rendered')
          checked = 0
          for p in sorted(root.glob('*.jpg')):
              im = Image.open(p).convert('L')
              hist = im.histogram()
              black = sum(hist[:8]) / (im.width * im.height)
              white = sum(hist[-8:]) / (im.width * im.height)
              if black > 0.90:
                  raise SystemExit(f'Suspicious mostly-black rendered page: {p} ({black:.2%})')
              if white > 0.995:
                  raise SystemExit(f'Suspicious blank rendered page: {p} ({white:.2%} white)')
              checked += 1
          print(f'Raster QA inspected {checked} rendered page images.')
          PY

      - name: Commit refreshed lockfile, bundle and sample PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json index.cjs samples/*.pdf
          git diff --cached --quiet || git commit -m "Rebuild and QA server-side PDF engine"
          git push origin HEAD:main

      - name: Upload PDF QA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pdf-engine-qa
          path: |
            samples/*.pdf
            samples/rendered/*.jpg
            samples/rendered/*.txt
