name: Regression Test

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master, phase-1-deployment-safety]

jobs:
  regression:
    name: Full POS Regression
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: posuser
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'pospassword' }}
          POSTGRES_DB: posdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PORT: 3099
      NODE_ENV: test
      SESSION_SECRET: ${{ secrets.SESSION_SECRET || 'ci-test-session-secret-32-chars!!' }}
      MIGRATION_DEPLOY_TOKEN: ci-only-not-a-production-secret-32chars
      MIGRATION_CONFIRMATION: APPLY_MIGRATIONS
      UNIQUEPOS_BOOTSTRAP_ADMIN_USERNAME: admin
      UNIQUEPOS_BOOTSTRAP_ADMIN_EMAIL: admin@test.local
      UNIQUEPOS_BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.BOOTSTRAP_ADMIN_PASSWORD || 'TestAdmin123!' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build / validate
        run: npm run build

      - name: Set DATABASE_URL
        run: |
          SCHEME="postgres"
          PG_PASS="${{ secrets.POSTGRES_PASSWORD || 'pospassword' }}"
          echo "DATABASE_URL=${SCHEME}://posuser:${PG_PASS}@localhost:5432/posdb" >> "$GITHUB_ENV"

      - name: Explicitly deploy database migrations
        run: node scripts/deploy-migrations.cjs

      - name: Start server after explicit migration deployment
        run: |
          node app.js > /tmp/uniquepos-server.log 2>&1 &
          echo $! > /tmp/server.pid
          READY=0
          for i in $(seq 1 60); do
            HEALTH=$(curl -fsS "http://localhost:$PORT/api/healthz" 2>/dev/null || true)
            if [ -n "$HEALTH" ]; then
              if printf '%s' "$HEALTH" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);process.exit(j.db_ok===true?0:1)}catch{process.exit(1)}})'; then
                echo "Server and database ready (attempt $i)"
                READY=1
                break
              fi
            fi
            echo "Waiting... attempt $i"
            sleep 1
          done
          if [ "$READY" != "1" ]; then
            echo "Server/database health check did not pass within 60 s"
            cat /tmp/uniquepos-server.log || true
            kill "$(cat /tmp/server.pid)" 2>/dev/null || true
            exit 1
          fi

      - name: Run regression tests
        run: node scripts/regression-test.cjs

      - name: Stop server
        if: always()
        run: |
          [ -f /tmp/server.pid ] && kill "$(cat /tmp/server.pid)" 2>/dev/null || true

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-report
          path: /tmp/regression-report.json
