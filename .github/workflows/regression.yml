name: Regression Test

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master, phase-1-deployment-safety]

jobs:
  regression:
    name: Full POS Regression
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: posuser
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'pospassword' }}
          POSTGRES_DB: posdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PORT: 3099
      NODE_ENV: test
      SESSION_SECRET: ${{ secrets.SESSION_SECRET || 'ci-test-session-secret-32-chars!!' }}
      MIGRATION_DEPLOY_TOKEN: ci-only-not-a-production-secret-32chars
      MIGRATION_CONFIRMATION: APPLY_MIGRATIONS
      # CI-only approval for the disposable Postgres service. Production still
      # requires its own explicit migration approval and fresh backup.
      MIGRATION_ALLOW_DESTRUCTIVE: YES
      MIGRATION_DESTRUCTIVE_APPROVAL: APPROVE_DESTRUCTIVE_MIGRATION
      MIGRATION_APPROVED_FILES: 0021_replace_canonical_catalog_with_exact_source.sql,0031_destroy_legacy_inventory_subsystem.sql
      UNIQUEPOS_BOOTSTRAP_ADMIN_USERNAME: admin
      UNIQUEPOS_BOOTSTRAP_ADMIN_EMAIL: admin@test.local
      UNIQUEPOS_BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.BOOTSTRAP_ADMIN_PASSWORD || 'TestAdmin123!' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Build / validate
        run: npm run build

      - name: Set DATABASE_URL
        run: |
          SCHEME="postgres"
          PG_PASS="${{ secrets.POSTGRES_PASSWORD || 'pospassword' }}"
          echo "DATABASE_URL=${SCHEME}://posuser:${PG_PASS}@localhost:5432/posdb" >> "$GITHUB_ENV"

      - name: Seed CI migration prerequisites
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE IF NOT EXISTS ci_backup_marker (
            id INTEGER PRIMARY KEY,
            created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
            note TEXT NOT NULL
          );
          INSERT INTO ci_backup_marker (id, note)
          VALUES (1, 'Disposable CI migration backup marker')
          ON CONFLICT (id) DO UPDATE SET created_at = NOW(), note = EXCLUDED.note;

          -- The historical 0015/0016 repair migrations operate on the optional
          -- bulk-import ledger. On a clean database the ledger is empty, but
          -- its runtime schema is still required for those historical repairs
          -- to replay safely before the later catalog migrations.
          CREATE TABLE IF NOT EXISTS product_import_jobs (
            id SERIAL PRIMARY KEY,
            source_type TEXT NOT NULL,
            file_name TEXT,
            source_name TEXT,
            object_path TEXT,
            status TEXT NOT NULL DEFAULT 'draft',
            column_mapping JSONB,
            options JSONB,
            summary JSONB,
            total_rows INTEGER NOT NULL DEFAULT 0,
            processed_rows INTEGER NOT NULL DEFAULT 0,
            valid_rows INTEGER NOT NULL DEFAULT 0,
            invalid_rows INTEGER NOT NULL DEFAULT 0,
            skipped_rows INTEGER NOT NULL DEFAULT 0,
            created_count INTEGER NOT NULL DEFAULT 0,
            updated_count INTEGER NOT NULL DEFAULT 0,
            duplicate_count INTEGER NOT NULL DEFAULT 0,
            error_count INTEGER NOT NULL DEFAULT 0,
            undo_data JSONB,
            last_error TEXT,
            created_by_id INTEGER,
            created_by_name TEXT,
            created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
            started_at TIMESTAMPTZ,
            completed_at TIMESTAMPTZ,
            undone_at TIMESTAMPTZ
          );
          CREATE TABLE IF NOT EXISTS product_import_rows (
            id SERIAL PRIMARY KEY,
            job_id INTEGER NOT NULL REFERENCES product_import_jobs(id) ON DELETE CASCADE,
            row_number INTEGER NOT NULL,
            raw_data JSONB NOT NULL,
            normalized_data JSONB,
            validation_errors JSONB,
            action TEXT,
            status TEXT NOT NULL DEFAULT 'pending',
            product_id INTEGER,
            created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
          );
          CREATE INDEX IF NOT EXISTS product_import_jobs_created_at_idx ON product_import_jobs (created_at DESC);
          CREATE INDEX IF NOT EXISTS product_import_jobs_status_idx ON product_import_jobs (status);
          CREATE INDEX IF NOT EXISTS product_import_rows_job_id_idx ON product_import_rows (job_id, row_number);
          SQL

      - name: Explicitly deploy database migrations
        run: node scripts/deploy-migrations.cjs

      - name: Start server after explicit migration deployment
        run: |
          node app.js > /tmp/uniquepos-server.log 2>&1 &
          echo $! > /tmp/server.pid
          READY=0
          for i in $(seq 1 60); do
            HEALTH=$(curl -fsS "http://localhost:$PORT/api/healthz" 2>/dev/null || true)
            if [ -n "$HEALTH" ]; then
              if printf '%s' "$HEALTH" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);process.exit(j.db_ok===true?0:1)}catch{process.exit(1)}})'; then
                echo "Server and database ready (attempt $i)"
                READY=1
                break
              fi
            fi
            echo "Waiting... attempt $i"
            sleep 1
          done
          if [ "$READY" != "1" ]; then
            echo "Server/database health check did not pass within 60 s"
            cat /tmp/uniquepos-server.log || true
            kill "$(cat /tmp/server.pid)" 2>/dev/null || true
            exit 1
          fi

      - name: Run regression tests
        run: node scripts/regression-test.cjs

      - name: Stop server
        if: always()
        run: |
          [ -f /tmp/server.pid ] && kill "$(cat /tmp/server.pid)" 2>/dev/null || true

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-report
          path: /tmp/regression-report.json
