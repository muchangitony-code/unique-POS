name: POS regression checks

on:
  push:
    branches: ["main", "chatgpt/**"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build and syntax validation
        run: npm run build
      - name: Counter runtime patch and syntax smoke test
        run: |
          node scripts/counter-runtime-patch.cjs
          node --check public/app.js
          node --check public/pos-catalog-compat.js
          node --check public/pos-auth-bridge.js
          node - <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('public/index.html', 'utf8');
          const app = fs.readFileSync('public/app.js', 'utf8');
          const compat = fs.readFileSync('public/pos-catalog-compat.js', 'utf8');
          const bridge = fs.readFileSync('public/pos-auth-bridge.js', 'utf8');
          if (html.indexOf('pos-catalog-compat.js') > html.indexOf('pos-auth-bridge.js')) throw new Error('Counter compatibility layer must load before auth bridge');
          if (html.indexOf('pos-auth-bridge.js') > html.indexOf('app.js')) throw new Error('Auth bridge must load before POS app');
          if (!app.includes('data-action=\\"add-to-basket\\"')) throw new Error('Counter Add to Basket action missing after patch');
          if (!app.includes('Cannot sell more than available stock.')) throw new Error('Counter stock guard missing after patch');
          if (!compat.includes('in_stock_only')) throw new Error('Counter compatibility stock fallback missing');
          if (!bridge.includes('Authorization')) throw new Error('Counter auth bridge missing Authorization support');
          console.log('Counter static smoke checks passed.');
          NODE
      - name: Verify quotation custom-item integration
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('public/index.html', 'utf8');
          const script = fs.readFileSync('public/quotation-custom-items.js', 'utf8');
          const migration = fs.readFileSync('migrations/0006_quotation_custom_items.sql', 'utf8');
          if (!html.includes('/quotation-custom-items.js')) throw new Error('Custom quotation script is not loaded by index.html');
          if (!script.includes('Add Non-Stock Item')) throw new Error('Non-stock quotation action is missing');
          if (!script.includes('product_id: productId')) throw new Error('Quotation items are not preserving product linkage');
          if (!script.includes('x-branch-id')) throw new Error('Quotation creation is missing branch scoping');
          if (!migration.includes('ALTER COLUMN product_id DROP NOT NULL')) throw new Error('Quotation migration does not permit non-stock items');
          console.log('Quotation custom-item integration checks passed.');
          NODE
