name: PDF QA

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Document PDF smoke tests
        run: node tests/pdf-document-smoke.cjs
      - name: Generate PDF QA fixtures
        run: node scripts/pdf-fixtures.js
      - name: Structural and branding PDF tests
        run: |
          node tests/pdf-structural.cjs
          node tests/pdf-branding-integrity.cjs
          node tests/pdf-logo-propagation.cjs
      - name: Download-path smoke test
        run: node scripts/pdf-download-smoke.cjs
      - name: Rasterize generated PDFs
        run: node tests/pdf-visual-qa.cjs
      - name: Upload rendered pages
        uses: actions/upload-artifact@v4
        with:
          name: pdf-rendered-pages
          path: out/rendered/*.jpg
          if-no-files-found: error
