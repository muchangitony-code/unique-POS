name: Fix Sales inventory read path

# One-shot repair workflow. It removes itself after the verified commit.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace Sales loader and remove legacy runtime patches
        shell: bash
        run: |
          set -euo pipefail

          test "$(git hash-object public/app.js)" = "3f95e397ca7a4384342a956292dba4daada4c64f"

          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');

          const appPath = 'public/app.js';
          const original = fs.readFileSync(appPath, 'utf8');

          function findFunctionEnd(text, start) {
            const open = text.indexOf('{', start);
            if (open < 0) throw new Error('Opening brace not found');
            let depth = 0, quote = null, template = false, lineComment = false, blockComment = false, escaped = false;
            for (let i = open; i < text.length; i += 1) {
              const ch = text[i], next = text[i + 1];
              if (lineComment) { if (ch === '\n') lineComment = false; continue; }
              if (blockComment) { if (ch === '*' && next === '/') { blockComment = false; i += 1; } continue; }
              if (quote) { if (escaped) { escaped = false; continue; } if (ch === '\\') { escaped = true; continue; } if (ch === quote) quote = null; continue; }
              if (template) { if (escaped) { escaped = false; continue; } if (ch === '\\') { escaped = true; continue; } if (ch === '`') template = false; continue; }
              if (ch === '/' && next === '/') { lineComment = true; i += 1; continue; }
              if (ch === '/' && next === '*') { blockComment = true; i += 1; continue; }
              if (ch === '"' || ch === "'") { quote = ch; continue; }
              if (ch === '`') { template = true; continue; }
              if (ch === '{') depth += 1;
              else if (ch === '}') { depth -= 1; if (depth === 0) return i + 1; }
            }
            throw new Error('Unterminated function');
          }

          const marker = 'async function loadSalesData() {';
          const start = original.indexOf(marker);
          if (start < 0) throw new Error('loadSalesData not found');
          const end = findFunctionEnd(original, start);
          const oldFunction = original.slice(start, end);

          const replacement = `async function loadSalesData() {
    const branchId = Number(state.currentBranchId || (els.branchSelect && els.branchSelect.value) || 0);
    const query = firstText(state.pos.search, '').trim();

    const [products, categories, customers, sales] = await Promise.all([
      branchId > 0
        ? apiJson('/api/v3/inventory/products?branchId=' + encodeURIComponent(String(branchId)) + (query ? '&q=' + encodeURIComponent(query) : '')).catch(function () { return { products: [] }; })
        : Promise.resolve({ products: [] }),
      apiJson('/api/categories').catch(function () { return []; }),
      apiJson('/api/customers?limit=200').catch(function () { return { data: [] }; }),
      apiJson('/api/pos/sales?limit=12').catch(function () { return { data: [] }; })
    ]);

    const liveProducts = normalizeList(products && products.products ? products.products : products).map(function (row) {
      const stock = firstNumber(row.quantity_on_hand, 0);
      const category = firstText(row.category, 'Others');
      return Object.assign({}, row, {
        product_id: row.id,
        product_code: firstText(row.sku, row.product_code, row.barcode, ''),
        sku: firstText(row.sku, row.product_code, ''),
        product_name: firstText(row.name, row.product_name, 'Product'),
        name: firstText(row.name, row.product_name, 'Product'),
        category_name: category,
        category: category,
        min_stock: firstNumber(row.reorder_level, row.min_stock, 0),
        current_stock: stock,
        stock: stock,
        available_stock: stock,
        quantity_on_hand: stock,
        is_out_of_stock: stock <= 0,
        out_of_stock: stock <= 0,
        in_stock: stock > 0
      });
    });

    state.pos.products = liveProducts;
    state.pos.categories = normalizeList(categories);
    state.pos.customers = normalizeList(customers);
    state.cache.sales = { recentSales: normalizeList(sales) };
  }`;

          const updated = original.slice(0, start) + replacement + original.slice(end);
          const beforeOutside = original.slice(0, start) + original.slice(end);
          const afterOutside = updated.slice(0, start) + updated.slice(start + replacement.length);
          if (beforeOutside !== afterOutside) throw new Error('Safety check failed: content outside loadSalesData changed');
          if (oldFunction === replacement) throw new Error('loadSalesData replacement made no change');
          fs.writeFileSync(appPath, updated);
          console.log('Verified: only loadSalesData changed in app.js.');
          console.log('Updated app.js SHA-256:', crypto.createHash('sha256').update(updated).digest('hex'));
          NODE

          node -e "const p=require('./package.json'); if (p.scripts.build !== 'node scripts/build.cjs') { throw new Error('Unexpected build command: '+p.scripts.build); }"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('public/index.html')
          s = p.read_text()
          old = '    <script src="/sales-v3-bridge.js?v=20260826-7" defer></script>\n'
          if old not in s: raise SystemExit('Expected sales bridge tag not found')
          p.write_text(s.replace(old, '', 1))
          p = Path('package.json')
          s = p.read_text()
          old = '"build": "node scripts/counter-runtime-patch.cjs && node scripts/build.cjs"'
          if old not in s: raise SystemExit('Expected counter patch build command not found')
          p.write_text(s.replace(old, '"build": "node scripts/build.cjs"', 1))
          PY

          rm -f public/sales-v3-bridge.js scripts/counter-runtime-patch.cjs
          node --check public/app.js
          node -e "const p=require('./package.json'); if (p.scripts.build !== 'node scripts/build.cjs') throw new Error('Build command verification failed');"
          test ! -e public/sales-v3-bridge.js
          test ! -e scripts/counter-runtime-patch.cjs
          if grep -R "sales-v3-bridge\|counter-runtime-patch" -n public/index.html package.json public/app.js 2>/dev/null; then exit 1; fi

          git diff --check
          echo '--- verified app.js change ---'
          git diff --unified=3 -- public/app.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/app.js public/index.html package.json public/sales-v3-bridge.js scripts/counter-runtime-patch.cjs .github/workflows/fix-sales-inventory.yml
          git rm -f public/sales-v3-bridge.js scripts/counter-runtime-patch.cjs .github/workflows/fix-sales-inventory.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Fix Sales branch inventory read path"
          git push origin main
