name: Apply invoice router fix

on:
  push:
    branches:
      - agent/fix-invoice-register

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove invoice ownership from legacy SPA renderer
        shell: python
        run: |
          from pathlib import Path
          path = Path('public/app.js')
          text = path.read_text()
          replacements = [
              ('      case "invoices":\n        return loadInvoicesData();\n', ''),
              ('      case "invoices":\n        renderInvoices();\n        break;\n', ''),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence, found {count}: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)

      - name: Validate targeted change
        run: |
          node --check public/app.js
          ! grep -n -A2 -B1 'case "invoices"' public/app.js

      - name: Build validation
        run: npm ci && npm run build

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-invoice-router-fix.yml
          git add public/app.js
          git commit -m 'fix: isolate invoice register from legacy SPA renderer'
          git push origin HEAD:agent/fix-invoice-register
