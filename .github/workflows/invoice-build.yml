name: Invoice Build Validation

on:
  pull_request:
    paths:
      - 'public/invoices.js'
      - 'public/invoices.css'
      - 'public/index.html'
      - 'public/app.js'
      - 'scripts/**'
      - 'server/**'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches:
      - invoice-module-clean

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate build
        run: npm run build
