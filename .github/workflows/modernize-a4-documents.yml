name: Apply A4 document modernization

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply document source patch
        run: node scripts/modernize-a4-documents.cjs

      - name: Remove one-time patch files
        run: |
          rm -f scripts/modernize-a4-documents.cjs .github/workflows/modernize-a4-documents.yml

      - name: Commit and push to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.cjs scripts/modernize-a4-documents.cjs .github/workflows/modernize-a4-documents.yml
          git diff --cached --quiet && exit 0
          git commit -m "Modernize A4 invoice and quotation terms"
          git push origin HEAD:${{ github.head_ref }}
