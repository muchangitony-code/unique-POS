    <script>
      /* Normalize a legacy generated-client defect before the application bundle loads.
         Some compiled screens prepend /api to paths that already begin with /api. */
      (function () {
        const nativeFetch = window.fetch.bind(window);
        function normalizeUrl(input) {
          if (typeof input === 'string') return input.replace(/(^|:\/\/[^/]+)\/api\/api\//, '$1/api/');
          if (input instanceof URL) {
            input = new URL(input.toString());
            input.pathname = input.pathname.replace(/^\/api\/api\//, '/api/');
            return input;
          }
          if (input instanceof Request) {
            const url = new URL(input.url);
            if (!url.pathname.startsWith('/api/api/')) return input;
            url.pathname = url.pathname.replace(/^\/api\/api\//, '/api/');
            return new Request(url.toString(), input);
          }
          return input;
        }
        window.fetch = function (input, init) {
          return nativeFetch(normalizeUrl(input), init);
        };

        /* A branding upload can point to an object that no longer exists after a
           clean deployment. Keep the POS usable while the correct logo is saved. */
        document.addEventListener('error', function (event) {
          const image = event.target;
          if (!(image instanceof HTMLImageElement)) return;
          if (image.dataset.brandFallbackApplied === '1') return;
          const src = image.getAttribute('src') || '';
          if (!src.includes('/storage/objects/uploads/')) return;
          image.dataset.brandFallbackApplied = '1';
          image.src = '/logo.jpg';
        }, true);
      })();
    </script>

      #root input[data-testid="input-email"],

      #root input[data-testid="input-email"]::placeholder,
