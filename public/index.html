<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unique POS</title><style>body{font-family:Arial;margin:0;background:#f4f6f8;color:#18212b}header{padding:16px;background:#fff;border-bottom:1px solid #ddd}main{max-width:1100px;margin:auto;padding:20px}.tabs button{margin:4px;padding:10px}.card{background:#fff;padding:18px;margin:12px 0;border-radius:8px}input,select{padding:9px;margin:4px;width:calc(100% - 12px);box-sizing:border-box}button{padding:9px 14px;cursor:pointer}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}.hidden{display:none}</style></head><body><header><b>UNIQUE POS — CLEAN BUILD</b><div class="tabs"><button onclick="show('setup')">Setup</button><button onclick="show('inventory')">Inventory</button><button onclick="show('sales')">Sales</button><button onclick="show('documents')">Documents</button><button onclick="show('reports')">Reports</button></div></header><main><section id="setup" class="card"><h2>Initial Setup</h2><input id="business" placeholder="Business name"><input id="branch" placeholder="Branch name"><input id="code" placeholder="Branch code"><input id="admin" placeholder="Administrator name"><input id="email" placeholder="Administrator email"><input id="password" type="password" placeholder="Administrator password"><button onclick="setup()">Create Fresh POS</button></section><section id="inventory" class="hidden"><div class="card"><h2>Add Product</h2><input id="sku" placeholder="SKU"><input id="barcode" placeholder="Barcode"><input id="product" placeholder="Product name"><input id="cost" type="number" placeholder="Cost price"><input id="price" type="number" placeholder="Selling price"><button onclick="addProduct()">Save Product</button></div><div class="card"><h2>Stock Movement</h2><input id="moveProduct" type="number" placeholder="Product ID"><input id="moveBranch" type="number" placeholder="Branch ID"><select id="moveType"><option value="opening">Opening</option><option value="receive">Receive</option><option value="adjustment">Adjustment</option><option value="return">Return</option></select><input id="qty" type="number" placeholder="Quantity (+/- for adjustment)"><button onclick="move()">Save Movement</button></div><div class="card"><h2>Products</h2><button onclick="loadProducts()">Refresh</button><table id="products"></table></div></section><section id="sales" class="hidden"><div class="card"><h2>New Sale</h2><input id="saleBranch" type="number" placeholder="Branch ID"><input id="saleProduct" type="number" placeholder="Product ID"><input id="saleQty" type="number" placeholder="Quantity"><input id="salePrice" type="number" placeholder="Unit price"><button onclick="sale()">Complete Sale</button></div><div class="card"><h2>Recent Sales</h2><button onclick="loadSales()">Refresh</button><table id="salesTable"></table></div></section><section id="documents" class="hidden"><div class="card"><h2>Create Invoice or Quotation</h2><select id="docKind"><option value="invoice">Invoice</option><option value="quotation">Quotation</option></select><input id="docBranch" type="number" placeholder="Branch ID"><input id="docDescription" placeholder="Item description"><input id="docQty" type="number" placeholder="Quantity"><input id="docPrice" type="number" placeholder="Unit price"><button onclick="documentCreate()">Create Document</button></div></section><section id="reports" class="hidden card"><h2>Sales Report</h2><button onclick="report()">Refresh Report</button><pre id="report"></pre></section><pre id="status"></pre></main><script>const $=id=>document.getElementById(id);const api=(u,o={})=>fetch('/api/'+u,{headers:{'content-type':'application/json'},...o}).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error||'request failed');return d});function show(id){document.querySelectorAll('main>section').forEach(x=>x.classList.add('hidden'));$(id).classList.remove('hidden')}function out(x){$('status').textContent=typeof x==='string'?x:JSON.stringify(x,null,2)}async function setup(){try{out(await api('setup',{method:'POST',body:JSON.stringify({business:{name:$('business').value},branch:{name:$('branch').value,code:$('code').value},admin:{name:$('admin').value,email:$('email').value,password:$('password').value}})}))}catch(e){out(e.message)}}async function addProduct(){try{out(await api('inventory/products',{method:'POST',body:JSON.stringify({sku:$('sku').value,barcode:$('barcode').value,name:$('product').value,cost_price:$('cost').value,selling_price:$('price').value})}));loadProducts()}catch(e){out(e.message)}}async function move(){try{out(await api('inventory/movements',{method:'POST',body:JSON.stringify({branch_id:$('moveBranch').value,product_id:$('moveProduct').value,movement_type:$('moveType').value,quantity_delta:$('qty').value})}));loadProducts()}catch(e){out(e.message)}}async function loadProducts(){try{const a=await api('inventory/products');$('products').innerHTML='<tr><th>ID</th><th>SKU</th><th>Name</th><th>Qty</th><th>Value</th></tr>'+a.map(x=>`<tr><td>${x.id}</td><td>${x.sku}</td><td>${x.name}</td><td>${x.quantity}</td><td>${x.selling_price}</td></tr>`).join('')}catch(e){out(e.message)}}async function sale(){try{out(await api('sales',{method:'POST',body:JSON.stringify({branch_id:$('saleBranch').value,items:[{product_id:$('saleProduct').value,quantity:$('saleQty').value,unit_price:$('salePrice').value}]})}));loadSales()}catch(e){out(e.message)}}async function loadSales(){try{const a=await api('sales');$('salesTable').innerHTML='<tr><th>No</th><th>Total</th><th>Date</th></tr>'+a.map(x=>`<tr><td>${x.sale_number}</td><td>${x.total}</td><td>${x.created_at}</td></tr>`).join('')}catch(e){out(e.message)}}async function documentCreate(){try{const k=$('docKind').value;out(await api(k+'s',{method:'POST',body:JSON.stringify({branch_id:$('docBranch').value,items:[{description:$('docDescription').value,quantity:$('docQty').value,unit_price:$('docPrice').value}]})}))}catch(e){out(e.message)}}async function report(){try{$('report').textContent=JSON.stringify(await api('reports/sales'),null,2)}catch(e){out(e.message)}}</script></body></html>
