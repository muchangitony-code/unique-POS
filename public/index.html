    <script>
      // Product Code is system-generated for new products. This small runtime
      // guard also protects deployments that still serve an older compiled
      // React bundle until the next frontend build is published.
      (() => {
        const apply = () => {
          document.querySelectorAll('input[name="product_code"]').forEach((input) => {
            if (input.value.trim()) return;
            const setter = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value')?.set;
            if (setter) setter.call(input, 'AUTO'); else input.value = 'AUTO';
            input.dispatchEvent(new Event('input', { bubbles: true }));
            input.dispatchEvent(new Event('change', { bubbles: true }));
          });
        };
        new MutationObserver(apply).observe(document.documentElement, { childList: true, subtree: true });
        document.addEventListener('focusin', (event) => {
          if (event.target instanceof HTMLInputElement && event.target.name === 'product_code' && !event.target.value.trim()) apply();
        });
      })();
    </script>
    <script>
      // Branded documents open in a separate print window. Browser print can
      // fire before remote logo/stamp/signature images finish loading, which
      // causes those assets to disappear from the printed receipt/invoice/
      // quotation. Wrap popup print so all images are settled first.
      (() => {
        const nativeOpen = window.open;
        if (!nativeOpen) return;
        window.open = function (...args) {
          const child = nativeOpen.apply(this, args);
          if (!child) return child;
          try {
            const nativePrint = child.print.bind(child);
            let printing = false;
            child.print = function () {
              if (printing) return;
              printing = true;
              const waitForImages = () => {
                try {
                  const images = Array.from(child.document?.images || []);
                  if (!images.length) {
                    nativePrint();
                    return;
                  }
                  Promise.all(images.map((img) => {
                    if (img.complete) return Promise.resolve();
                    return new Promise((resolve) => {
                      const done = () => resolve();
                      img.addEventListener('load', done, { once: true });
                      img.addEventListener('error', done, { once: true });
                      setTimeout(done, 5000);
                    });
                  })).then(() => setTimeout(nativePrint, 50));
                } catch {
                  nativePrint();
                }
              };
              setTimeout(waitForImages, 0);
            };
          } catch {
            // Leave non-document popups untouched if the browser blocks wrapping.
          }
          return child;
        };
      })();
    </script>
