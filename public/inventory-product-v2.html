<section data-inventory-product-root class="inventory-product-v2">
  <div class="inventory-product-toolbar">
    <h1>Products & Inventory</h1>
    <input id="inventory-v2-search" type="search" placeholder="Search product, SKU or barcode">
    <button id="inventory-v2-refresh" type="button">Refresh</button>
    <button id="inventory-v2-add" type="button">Add Product</button>
  </div>
  <div id="inventory-v2-status">No products loaded.</div>
  <table id="inventory-v2-table">
    <thead><tr><th>SKU</th><th>Product</th><th>Category</th><th>Cost</th><th>Selling</th><th>Stock</th></tr></thead>
    <tbody></tbody>
  </table>
</section>
<script>
(() => {
  const state = { products: [] };
  const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
  async function load() {
    const q = document.querySelector('#inventory-v2-search').value.trim();
    const r = await fetch('/api/v2/inventory/products?q=' + encodeURIComponent(q), {headers:{Accept:'application/json'}});
    if (!r.ok) throw new Error('Unable to load products');
    const data = await r.json(); state.products = data.products || []; render();
  }
  function render() {
    const body=document.querySelector('#inventory-v2-table tbody');
    document.querySelector('#inventory-v2-status').textContent = state.products.length ? `${state.products.length} products` : 'No products. Add or import your new stock master.';
    body.innerHTML=state.products.map(p=>`<tr><td>${esc(p.sku)}</td><td>${esc(p.name)}</td><td>${esc(p.category)}</td><td>${esc(p.cost_price)}</td><td>${esc(p.selling_price)}</td><td>${esc(p.quantity_on_hand)}</td></tr>`).join('');
  }
  document.querySelector('#inventory-v2-refresh').addEventListener('click',()=>load().catch(e=>alert(e.message)));
  document.querySelector('#inventory-v2-search').addEventListener('input',()=>load().catch(()=>{}));
  load().catch(e=>{document.querySelector('#inventory-v2-status').textContent=e.message;});
})();
</script>
